[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pv-underwriting-ai"
version = "0.1.0"
description = "Distributed photovoltaic property insurance AI underwriting system"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.28,<1.0",
    "pillow>=11.0,<13.0",
    "pydantic>=2.10,<3.0",
    "pymupdf>=1.25,<2.0",
    "python-dotenv>=1.0,<2.0",
    "python-multipart>=0.0.20,<1.0",
    "uvicorn>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.9,<1.0",
]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend", ".", "tests", "component-model-workbench"]
testpaths = ["tests", "component-model-workbench/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
