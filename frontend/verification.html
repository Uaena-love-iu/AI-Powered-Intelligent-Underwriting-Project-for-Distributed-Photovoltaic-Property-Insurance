<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>案件证据与核保复核 · v2</title>
<style>body{margin:0;background:#f3f6f5;color:#183b35;font:16px/1.65 system-ui,sans-serif}main{max-width:1160px;margin:auto;padding:28px}header,.card{background:white;border:1px solid #c9d9d3;border-radius:12px;padding:22px;margin:18px 0}h1{font-size:26px;margin:0}h2{font-size:20px}h3{font-size:17px}label{display:block;margin:10px 0}select,input,textarea,button{font:inherit;box-sizing:border-box}select,input,textarea{padding:9px;border:1px solid #b3c8c0;border-radius:6px;max-width:100%}textarea{width:100%;min-height:80px}button,.link{background:#176b58;color:white;border:0;border-radius:6px;padding:9px 16px;cursor:pointer;margin:5px}button:disabled{opacity:.45;cursor:not-allowed}a{color:#126e67}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f1f5f4;padding:12px;font-size:13px}.muted{color:#526d64;font-size:14px}.warning{color:#925100}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.badge{display:inline-block;padding:3px 10px;background:#e5f2ed;border-radius:5px}.error{color:#a72b25}#message{position:sticky;top:0;background:#fff6d8;padding:10px;z-index:2}details{margin:12px 0}#message:empty{display:none}</style></head>
<body><main><a href="/evaluation">← 核保工作台 v2</a><header><h1>案件证据与核保复核</h1><p id="summary">读取案件…</p><label>操作人（启用认证后以登录账号为准） <input id="actor" maxlength="100" placeholder="请填写姓名"></label><button id="refresh">刷新最新版本</button><a id="download">下载本版报告</a></header><div id="message" role="status"></div><section class="card" id="final"></section><div id="issues"></div><section class="card"><h2>识别与查证记录</h2><p class="muted">原始识别、核验结果与人工业务意见分别留存。人工选择不作为模型训练真值。</p><div id="trace"></div></section><section class="card"><h2>版本及操作历史</h2><div id="history"></div></section></main><script src="/verification.js"></script></body></html>
