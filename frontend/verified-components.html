<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>已核验参数库 · 光伏核保</title>
<link rel="stylesheet" href="/workbench.css"><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7f4;color:#233f36;font:15px/1.6 system-ui,"Microsoft Yahei",sans-serif}header,main{max-width:1240px;margin:auto;padding:24px 32px}header{padding-bottom:0}h1{margin:0;font-size:27px}h2{font-size:19px;margin-top:0}p{margin:8px 0}.muted{color:#64786e;font-size:13px}.notice{background:#e7f1ec;border-left:4px solid #2a7158;padding:14px 18px;border-radius:8px;margin-top:18px}section,article,details.editor{background:white;border:1px solid #d5e3da;border-radius:10px;padding:20px;margin:16px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:5px;font-weight:600}input,textarea,select,button{font:inherit;border:1px solid #bdcfc3;border-radius:6px;padding:9px 11px;min-width:0}input,textarea,select{width:100%;background:#fff;color:#263c33}textarea{min-height:78px;resize:vertical;font-weight:400}.full{grid-column:1/-1}button{cursor:pointer;background:#25664e;color:white}button.secondary{background:white;color:#355d49}button:disabled{opacity:.5;cursor:wait}summary{cursor:pointer;font-weight:600}fieldset{margin:16px 0;border:1px solid #d5e3da;border-radius:8px;padding:14px}legend{font-weight:600}.check{display:flex;gap:8px;align-items:flex-start;margin:16px 0}.check input{width:auto;margin-top:7px}.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.tools input{flex:1;min-width:180px}.badge{font-size:13px;padding:3px 10px;border-radius:20px;background:#e7f1ec}.badge.revoked,.badge.expired{background:#f6e9df;color:#8c4b25}.badge.scheduled{background:#e7edf5;color:#3a5677}.record-title{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.record-title h2{margin:0}table{width:100%;border-collapse:collapse;margin:12px 0}th,td{text-align:left;border-bottom:1px solid #e1e8e3;padding:8px;vertical-align:top}a{color:#216b51}pre,p,td,small{overflow-wrap:anywhere}#status{position:sticky;top:0;background:#f4f7f4;z-index:1;padding:8px 0;min-height:40px}#status.error{color:#a53025}.record details{margin-top:12px}.record details p{white-space:pre-wrap}.record small{display:block}.revoke{margin-top:14px;padding:14px;background:#faf6f1;border-radius:8px}.revoke button{margin-top:10px} @media(max-width:850px){header,main{padding:18px}.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body>
<header><p class="muted">规则与证据管理</p><h1>已核验参数库</h1><p>将有来源的组件参数保留为可追溯的复用记录。</p><div class="notice"><strong>复用参数，不等于核保通过</strong><p>仅在完整型号匹配、记录生效且未撤销时复用规格书参数。安装条件、项目位置、风雪风险及其他已选规则仍独立核验。</p><p class="muted">本版支持额定功率、正面及背面机械载荷。保留测试／设计口径，不将机械载荷直接登记为风荷载或雪荷载。其他类型的白名单暂不开放。</p></div></header>
<main><div id="status" role="status" aria-live="polite"></div>
<details class="editor" id="editor"><summary>＋ 新增核验记录</summary><p class="muted">录入前请核对完整型号、来源原文和适用条件；保存即确认本次参数核验。已有记录不直接覆盖，更新时需撤销旧记录，再登记新版本。</p>
<form id="approvalForm"><div class="grid">
<label class="field">完整组件型号<input name="component_model" required maxlength="100" placeholder="包含功率档及全部后缀"></label>
<label class="field">制造商<input name="manufacturer" required minlength="2" maxlength="120"></label>
<label class="field">来源文件名称／版本<input name="document_title" required minlength="2" maxlength="200" placeholder="规格书名称、版本或日期"></label>
<label class="field">核验／审批人<input name="reviewer_name" required maxlength="100"></label>
<label class="field">生效时间<input name="valid_from" type="datetime-local" required></label><label class="field">到期时间<input name="expires_at" type="datetime-local" required></label>
<label class="field full">来源适用条件<textarea name="applicability" required minlength="2" maxlength="2000" placeholder="说明市场版本、安装方式、夹具位置等；来源未明确的条件也请注明。这不代表已确认本项目安装条件。"></textarea></label>
<label class="field full">核验依据与复用原因<textarea name="reason" required minlength="2" maxlength="2000" placeholder="说明核对了哪些证据，为什么可以复用这些参数"></textarea></label>
</div><div id="parameterFields"></div><label class="check"><input name="exact_model_verified" type="checkbox" required><span>我已核验完整型号及各项来源原文；本记录只用于参数复用，不豁免任何核保规则。</span></label><button type="submit">确认核验并保存</button></form></details>
<section><h2>核验记录</h2><div class="tools"><input id="search" aria-label="搜索型号或制造商" placeholder="搜索型号或制造商"><select id="statusFilter" aria-label="筛选记录状态" style="width:auto"><option value="">全部状态</option><option value="active">生效中</option><option value="scheduled">待生效</option><option value="expired">已到期</option><option value="revoked">已撤销</option></select><button id="refresh" class="secondary">刷新</button></div><p id="count" class="muted"></p><div id="records"></div></section>
</main><script src="/workbench.js"></script><script src="/verified-components.js"></script></body></html>
